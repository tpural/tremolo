# tremolo on one machine: the server, VictoriaMetrics, VictoriaLogs and VictoriaTraces.
#   docker compose up -d
# UI on http://localhost:8080; push OTLP to :4318 (HTTP) or :4317 (gRPC).
# To also collect this machine's own metrics and logs:
#   HOST_NAME=$(hostname) docker compose --profile collector up -d
name: tremolo

services:
  tremolo:
    image: ghcr.io/tpural/tremolo:${TREMOLO_VERSION:-latest}
    command:
      - --metrics-url=http://victoriametrics:8428
      - --logs-url=http://victorialogs:9428
      - --traces-url=http://victoriatraces:10428
      - --data-dir=/home/nonroot
      # - --ingest-tokens-file=/etc/tremolo/tokens.yaml
      # - --rules-dir=/etc/tremolo/rules
      # - --alerts-config=/etc/tremolo/alerts.yaml
    volumes:
      - state:/home/nonroot
      # - ./tokens.yaml:/etc/tremolo/tokens.yaml:ro
      # - ./rules:/etc/tremolo/rules:ro
      # - ./alerts.yaml:/etc/tremolo/alerts.yaml:ro
    ports:
      - "8080:8080"
      - "4318:4318"
      - "4317:4317"
    depends_on: [victoriametrics, victorialogs, victoriatraces]
    restart: unless-stopped

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.155.0
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=30d
      - -opentelemetry.usePrometheusNaming
    volumes:
      - metrics:/storage
    restart: unless-stopped

  victorialogs:
    image: victoriametrics/victoria-logs:v1.53.0
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=14d
    volumes:
      - logs:/storage
    restart: unless-stopped

  victoriatraces:
    image: victoriametrics/victoria-traces:v0.12.1
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=7d
    volumes:
      - traces:/storage
    restart: unless-stopped

  collector:
    profiles: [collector]
    image: otel/opentelemetry-collector-contrib:0.163.2
    command: [--config=/etc/otelcol/config.yaml]
    environment:
      TREMOLO_URL: http://tremolo:4318
      TREMOLO_TOKEN: ""
      HOSTFS: /hostfs
      OTEL_RESOURCE_ATTRIBUTES: host.name=${HOST_NAME:-docker-host}
    volumes:
      - ../host/otelcol.yaml:/etc/otelcol/config.yaml:ro
      - /:/hostfs:ro
      - /var/log:/var/log:ro
    # Root, to read the host's log files.
    user: "0"
    restart: unless-stopped

volumes:
  state:
  metrics:
  logs:
  traces:
