# tremolo: the server. UI and API on 8080; ingest on 4318 (OTLP/HTTP, Prometheus remote write,
# Loki push) and 4317 (OTLP/gRPC).
image:
  repository: ghcr.io/tpural/tremolo
  tag: ""  # defaults to the chart's appVersion
  pullPolicy: IfNotPresent

# Where the UI reads from. The defaults are the services this chart installs.
metricsURL: http://tremolo-metrics-server:8428
logsURL: http://tremolo-logs-server:9428
# VictoriaTraces. Defaults to this chart's when traces.enabled; set it to use another.
tracesURL: ""
# Providers tell tremolo why a host is down when that's on purpose, so it reads as asleep or in
# maintenance rather than broken. Maintenance windows, set from a host's page, are always on.
providers:
  kubernetes:
    # Node taints that mean a node is asleep on purpose, e.g. [possum.dev/asleep]. Cordoned
    # nodes count as in maintenance.
    asleepTaints: []
  # possum (github.com/tpural/possum), a power autoscaler: lists the nodes it has suspended or
  # switched off, and their groups.
  possum:
    enabled: false
    url: http://possum.possum.svc:8080

# Alert rules: Starlark (Python-like) files with a check(now) function. Built-ins: host-down,
# crash-loop, disk-full. See docs/alerts.md for writing your own.
alerts:
  # Extra rules by file name, e.g. gpu-busy.star. A file named like a built-in replaces it.
  # Files under a folder (lib/x.star) can't be keys here; use existingRulesConfigMap for load().
  rules: {}
  # Or an existing ConfigMap of rule files, e.g. from a kustomize configMapGenerator.
  existingRulesConfigMap: ""
  config:
    # The zone rules see now in.
    timezone: UTC
    # tremolo's address, for links in notifications.
    url: ""
    # Send a firing alert again this often; "0s" sends it once.
    repeat: 4h
    # Built-in rules to leave out.
    disable: []
    # Where each severity goes when a rule doesn't say: a channel, an escalation, or a list.
    notify: {}
    #  page: oncall
    #  warn: phone
    # Channels by name. Types: homeassistant, slack, email, twilio, ntfy, webhook (see docs/alerts.md).
    channels: {}
    #  phone:
    #    type: homeassistant
    #    url: http://home-assistant.home-assistant.svc
    #    service: mobile_app_my_phone
    #    token: ${HA_TOKEN}           # from envFromSecret
    # Escalation chains: steps sent after an alert has fired unacknowledged for a while.
    escalations: {}
    #  oncall:
    #    - notify: phone
    #    - after: 15m
    #      notify: [slack, sms]
  # A Secret whose keys become environment variables, for ${VAR}s in config.
  envFromSecret: ""

# Sign-in. On the first start tremolo creates a user named admin; its password comes from this
# Secret, or is random and printed once in tremolo's log.
auth:
  adminPasswordSecret: {}
  #  name: tremolo-admin
  #  key: password

# tremolo's own state: users, alerts, silences and maintenance windows. Without it, they're
# lost on restart.
persistence:
  enabled: true
  size: 1Gi
  storageClass: ""

# How long a host that stopped sending metrics stays listed as unreachable. Keep it at or
# below metrics.server.retentionPeriod.
hostLookback: 720h

# Extra dashboards, by file name. A dashboard with a built-in's id replaces it.
dashboards: {}
#  my-service.yaml: |
#    id: my-service
#    title: My service
#    group: Services
#    panels:
#      - title: Requests
#        query: sum(rate(http_requests_total{namespace="my-service"}[5m]))

resources:
  requests: {cpu: 10m, memory: 32Mi}
  limits: {memory: 128Mi}
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

service:
  port: 80
  ingestPort: 4318
  grpcPort: 4317

# Bearer tokens for senders, as name: token. Each sender's name becomes a "source" label.
# Without tokens, anyone who can reach the ingest ports can write.
ingest:
  tokens: {}
  # Or an existing Secret with a key tokens.yaml holding the same YAML map.
  existingSecret: ""

# Gateway API route to the UI.
httpRoute:
  enabled: false
  hostnames: []
  parentRefs: []
  annotations: {}

# VictoriaMetrics single node: metrics storage.
metrics:
  enabled: true
  server:
    fullnameOverride: tremolo-metrics-server
    retentionPeriod: 30d
    extraArgs:
      envflag.enable: true
      envflag.prefix: VM_
      loggerFormat: json
      # OpenTelemetry names become Prometheus names, e.g. system_cpu_time_seconds_total.
      opentelemetry.usePrometheusNaming: true
    persistentVolume:
      enabled: true
      size: 20Gi
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 1Gi}

# VictoriaLogs single node: log storage.
logs:
  enabled: true
  server:
    fullnameOverride: tremolo-logs-server
    retentionPeriod: 14d
    persistentVolume:
      enabled: true
      size: 20Gi
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 1Gi}

# VictoriaTraces single node: trace storage. Off by default while VictoriaTraces is before 1.0.
traces:
  enabled: false
  server:
    fullnameOverride: tremolo-traces-server
    retentionPeriod: 7d
    persistentVolume:
      enabled: true
      size: 10Gi
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 1Gi}

# Collect this cluster's metrics, logs and events and send them to this server.
# The same chart, tremolo-kubernetes-collector, can be installed alone in other clusters.
kubernetes:
  enabled: true
  tremolo:
    url: http://tremolo:4318
    # One of ingest.tokens, when tokens are set.
    token: ""
