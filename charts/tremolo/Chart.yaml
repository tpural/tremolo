apiVersion: v2
name: tremolo
description: Self-hosted observability with alerts as code. Accepts OTLP, Prometheus remote write and Loki pushes, stores them in VictoriaMetrics, VictoriaLogs and VictoriaTraces, and serves dashboards, log search, traces and alerting.
type: application
version: 0.1.0
appVersion: "0.1.0"
home: https://github.com/tpural/tremolo
sources:
  - https://github.com/tpural/tremolo
keywords: [observability, monitoring, logs, traces, dashboards, victoriametrics, victorialogs, victoriatraces, opentelemetry, alerting, self-hosted]
dependencies:
  - name: victoria-metrics-single
    alias: metrics
    version: 0.50.0
    repository: https://victoriametrics.github.io/helm-charts/
    condition: metrics.enabled
  - name: victoria-logs-single
    alias: logs
    version: 0.13.11
    repository: https://victoriametrics.github.io/helm-charts/
    condition: logs.enabled
  - name: victoria-traces-single
    alias: traces
    version: 0.1.12
    repository: https://victoriametrics.github.io/helm-charts/
    condition: traces.enabled
  - name: tremolo-kubernetes-collector
    alias: kubernetes
    version: ">=0.0.0-0"
    repository: file://../tremolo-kubernetes-collector
    condition: kubernetes.enabled
