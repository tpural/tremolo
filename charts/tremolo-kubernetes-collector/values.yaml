# This cluster's name in tremolo, which groups its nodes. Useful when several clusters report
# to one tremolo.
clusterName: ""

# Where to send everything: a tremolo server's ingest address (OTLP/HTTP, port 4318).
tremolo:
  url: http://tremolo:4318
  # Bearer token, if the server has ingest tokens configured.
  token: ""
  # Set to false to provide the Secret "tremolo-collector-target" (keys url, token, cluster) yourself,
  # e.g. encrypted with SOPS.
  createSecret: true

# The destination, for both collectors.
x-target-env: &target
  - name: TREMOLO_URL
    valueFrom:
      secretKeyRef: {name: tremolo-collector-target, key: url}
  - name: TREMOLO_TOKEN
    valueFrom:
      secretKeyRef: {name: tremolo-collector-target, key: token, optional: true}
  - name: K8S_CLUSTER_NAME
    valueFrom:
      secretKeyRef: {name: tremolo-collector-target, key: cluster, optional: true}

# On every node: host metrics and container logs.
agent:
  enabled: true
  mode: daemonset
  fullnameOverride: tremolo-agent
  image:
    repository: otel/opentelemetry-collector-k8s
  presets:
    hostMetrics:
      enabled: true
    logsCollection:
      enabled: true
      storeCheckpoints: true
    kubernetesAttributes:
      enabled: true
  extraEnvs: *target
  # Run everywhere, including tainted and sleeping nodes.
  tolerations:
    - operator: Exists
  # A sleeping node's pod can't be replaced until it wakes; with the default of one unavailable pod
  # at a time, that would hold up the rollout on every other node.
  rollout:
    rollingUpdate:
      maxUnavailable: 50%
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}
  ports:
    jaeger-compact: {enabled: false}
    jaeger-thrift: {enabled: false}
    jaeger-grpc: {enabled: false}
    zipkin: {enabled: false}
  config:
    receivers:
      jaeger: null
      zipkin: null
    processors:
      # Kubernetes nodes and plain machines share the host_name label; tremolo.collector tells them apart.
      resource/host:
        attributes:
          - {key: host.name, value: "${env:K8S_NODE_NAME}", action: upsert}
          - {key: tremolo.collector, value: kubernetes, action: upsert}
          - {key: k8s.cluster.name, value: "${env:K8S_CLUSTER_NAME}", action: upsert}
    exporters:
      otlp_http/metrics:
        endpoint: ${env:TREMOLO_URL}
        headers:
          Authorization: Bearer ${env:TREMOLO_TOKEN}
      otlp_http/logs:
        endpoint: ${env:TREMOLO_URL}
        headers:
          Authorization: Bearer ${env:TREMOLO_TOKEN}
          VL-Stream-Fields: k8s.namespace.name,k8s.pod.name,k8s.container.name
      otlp_http/traces:
        endpoint: ${env:TREMOLO_URL}
        headers:
          Authorization: Bearer ${env:TREMOLO_TOKEN}
    service:
      pipelines:
        # Apps on a node can send OTLP to its agent (the node's IP, ports 4317/4318), which adds
        # pod, namespace and node to their traces, metrics and logs.
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource/host, batch]
          exporters: [otlp_http/traces]
        metrics:
          processors: [memory_limiter, resource/host, batch]
          exporters: [otlp_http/metrics]
        logs:
          processors: [memory_limiter, resource/host, batch]
          exporters: [otlp_http/logs]

# Once per cluster: object state, events, container CPU/memory (cAdvisor, read through the API
# server so its certificate is verified), and /metrics of pods annotated prometheus.io/scrape.
cluster:
  enabled: true
  mode: deployment
  fullnameOverride: tremolo-cluster
  image:
    repository: otel/opentelemetry-collector-k8s
  presets:
    clusterMetrics:
      enabled: true
    kubernetesEvents:
      enabled: true
  extraEnvs: *target
  clusterRole:
    rules:
      - apiGroups: [""]
        resources: [pods, services, endpoints, nodes]
        verbs: [get, list, watch]
      - apiGroups: [""]
        resources: [nodes/proxy]
        verbs: [get]
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}
  ports:
    jaeger-compact: {enabled: false}
    jaeger-thrift: {enabled: false}
    jaeger-grpc: {enabled: false}
    zipkin: {enabled: false}
  config:
    receivers:
      jaeger: null
      zipkin: null
      prometheus/cadvisor:
        config:
          scrape_configs:
            - job_name: kubernetes-cadvisor
              scrape_interval: 30s
              scheme: https
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              authorization:
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              kubernetes_sd_configs:
                - role: node
              relabel_configs:
                - target_label: __address__
                  replacement: kubernetes.default.svc:443
                - source_labels: [__meta_kubernetes_node_name]
                  target_label: __metrics_path__
                  replacement: /api/v1/nodes/$${1}/proxy/metrics/cadvisor
                - source_labels: [__meta_kubernetes_node_name]
                  target_label: node
              # cAdvisor exposes hundreds of series per container; keep what the UI uses.
              metric_relabel_configs:
                - source_labels: [__name__]
                  action: keep
                  regex: container_(cpu_usage_seconds_total|memory_working_set_bytes|cpu_cfs_(throttled_)?periods_total|network_(receive|transmit)_bytes_total|oom_events_total)
      # Each PersistentVolumeClaim's used and total bytes, from the kubelets.
      prometheus/kubelet:
        config:
          scrape_configs:
            - job_name: kubernetes-kubelet
              scrape_interval: 60s
              scheme: https
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              authorization:
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              kubernetes_sd_configs:
                - role: node
              relabel_configs:
                - target_label: __address__
                  replacement: kubernetes.default.svc:443
                - source_labels: [__meta_kubernetes_node_name]
                  target_label: __metrics_path__
                  replacement: /api/v1/nodes/$${1}/proxy/metrics
                - source_labels: [__meta_kubernetes_node_name]
                  target_label: node
              metric_relabel_configs:
                - source_labels: [__name__]
                  action: keep
                  regex: kubelet_volume_stats_(used|capacity|available)_bytes
      prometheus/pods:
        config:
          scrape_configs:
            - job_name: kubernetes-pods
              scrape_interval: 30s
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  action: keep
                  regex: "true"
                - source_labels: [__meta_kubernetes_pod_phase]
                  action: keep
                  regex: Running
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                  action: replace
                  target_label: __metrics_path__
                  regex: (.+)
                - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                  action: replace
                  regex: ([^:]+)(?::\d+)?;(\d+)
                  replacement: $$1:$$2
                  target_label: __address__
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
                - source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: node
    processors:
      resource/cluster:
        attributes:
          - {key: tremolo.collector, value: kubernetes, action: upsert}
          - {key: k8s.cluster.name, value: "${env:K8S_CLUSTER_NAME}", action: upsert}
      # Kubernetes events arrive as the whole Event object, with no message: make one from
      # the reason and note, keep the fields worth searching, and drop the rest (managedFields…).
      transform/events:
        error_mode: ignore
        log_statements:
          - conditions:
              - IsMap(log.body) and log.body["object"] != nil and log.body["object"]["kind"] == "Event"
            statements:
              - set(log.attributes["k8s.event.reason"], log.body["object"]["reason"])
              - set(log.attributes["k8s.event.type"], log.body["object"]["type"])
              - set(log.attributes["k8s.event.count"], log.body["object"]["deprecatedCount"])
              - set(log.attributes["k8s.event.controller"], log.body["object"]["reportingController"])
              - set(log.attributes["k8s.event.object.kind"], log.body["object"]["regarding"]["kind"])
              - set(log.attributes["k8s.event.object.name"], log.body["object"]["regarding"]["name"])
              - set(log.attributes["k8s.pod.name"], log.body["object"]["regarding"]["name"]) where log.body["object"]["regarding"]["kind"] == "Pod"
              - set(log.attributes["k8s.node.name"], log.body["object"]["regarding"]["name"]) where log.body["object"]["regarding"]["kind"] == "Node"
              - set(log.severity_text, "WARN") where log.body["object"]["type"] == "Warning"
              - set(log.severity_number, SEVERITY_NUMBER_WARN) where log.body["object"]["type"] == "Warning"
              - set(log.severity_text, "INFO") where log.body["object"]["type"] == "Normal"
              - set(log.severity_number, SEVERITY_NUMBER_INFO) where log.body["object"]["type"] == "Normal"
              - 'set(log.body, Concat([log.body["object"]["reason"], log.body["object"]["note"]], ": "))'
    exporters:
      otlp_http/metrics:
        endpoint: ${env:TREMOLO_URL}
        headers:
          Authorization: Bearer ${env:TREMOLO_TOKEN}
      otlp_http/logs:
        endpoint: ${env:TREMOLO_URL}
        headers:
          Authorization: Bearer ${env:TREMOLO_TOKEN}
          VL-Stream-Fields: k8s.namespace.name,k8s.object.kind,k8s.object.name
    service:
      pipelines:
        traces: null
        metrics:
          receivers: [otlp, prometheus, prometheus/cadvisor, prometheus/kubelet, prometheus/pods]
          processors: [memory_limiter, resource/cluster, batch]
          exporters: [otlp_http/metrics]
        logs:
          processors: [memory_limiter, resource/cluster, transform/events, batch]
          exporters: [otlp_http/logs]
